services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: domi_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domi_logistica_db}
      POSTGRES_USER: ${POSTGRES_USER:-domi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DomiSecure2026_xK9!}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domi_admin} -d ${POSTGRES_DB:-domi_logistica_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domi_redis_local
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: domi_backend_local
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      SERVER_PORT: 3001
      SERVER_HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      DATABASE_URL: ${DATABASE_URL:-postgresql://domi_admin:DomiSecure2026_xK9!@postgres:5432/domi_logistica_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-adh_solutions_secret_jwt_key_2026_prod!}
      JWT_EXPIRES_IN: 7d
      OSRM_URL: ${OSRM_URL:-http://router.project-osrm.org}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/app-universal/Dockerfile
    container_name: domi_web_local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:

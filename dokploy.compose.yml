version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: domi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domi_logistica_db}
      POSTGRES_USER: ${POSTGRES_USER:-domi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DomiSecure2026_xK9!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domi_admin} -d ${POSTGRES_DB:-domi_logistica_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domi_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: domi_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVER_PORT: 3001
      SERVER_HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      DATABASE_URL: ${DATABASE_URL:-postgresql://domi_admin:DomiSecure2026_xK9!@postgres:5432/domi_logistica_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-adh_solutions_secret_jwt_key_2026_prod!}
      JWT_EXPIRES_IN: 7d
      OSRM_URL: ${OSRM_URL:-http://router.project-osrm.org}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.domi-api.rule=Host(`domiapi.adhsolutions.tech`)"
      - "traefik.http.routers.domi-api.entrypoints=websecure"
      - "traefik.http.routers.domi-api.tls=true"
      - "traefik.http.routers.domi-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.domi-api.loadbalancer.server.port=3001"

  web:
    build:
      context: .
      dockerfile: packages/app-universal/Dockerfile
    container_name: domi_web
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.domi-app.rule=Host(`domiapp.adhsolutions.tech`)"
      - "traefik.http.routers.domi-app.entrypoints=websecure"
      - "traefik.http.routers.domi-app.tls=true"
      - "traefik.http.routers.domi-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.domi-app.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

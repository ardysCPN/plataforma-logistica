name: Compilar APK Android (DOMY)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/app-universal/**'
      - 'packages/shared/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de compilación EAS (preview genera archivo .apk directo)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-apk:
    name: Compilación APK en Expo EAS Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias del Monorepo
        run: npm ci

      - name: Compilar Paquete Compartido del Monorepo
        run: npm run build -w @plataforma/shared

      - name: Instalar y Configurar Expo EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vincular Proyecto en Expo (EAS Init)
        working-directory: packages/app-universal
        run: |
          npx eas-cli init --account ardyscpn --non-interactive || true

      - name: Lanzar Compilación APK en la Nube de Expo
        working-directory: packages/app-universal
        run: |
          npx eas-cli build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive

      - name: Obtener y Descargar APK Compilado
        working-directory: packages/app-universal
        run: |
          APK_URL=$(npx eas-cli build:list --limit=1 --platform=android --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          echo "URL del artefacto APK: $APK_URL"
          if [ "$APK_URL" != "null" ] && [ -n "$APK_URL" ]; then
            curl -L -o domy.apk "$APK_URL"
          else
            echo "Aviso: No se pudo descargar el archivo APK automáticamente."
          fi

      - name: Adjuntar APK a los Artefactos de la Ejecución en GitHub
        uses: actions/upload-artifact@v4
        if: hashFiles('packages/app-universal/domy.apk') != ''
        with:
          name: domy-apk
          path: packages/app-universal/domy.apk

      - name: Publicar APK en GitHub Releases (Enlace Permanente de Descarga)
        if: hashFiles('packages/app-universal/domy.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0-apk > /dev/null 2>&1; then
            gh release upload v1.0.0-apk packages/app-universal/domy.apk --clobber
          else
            gh release create v1.0.0-apk packages/app-universal/domy.apk \
              --title "DOMY Android APK (v1.0.0)" \
              --notes "Compilación oficial de DOMY APK para Android generada mediante EAS Build."
          fi

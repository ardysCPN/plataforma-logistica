name: Compilar APK Android (DOMY)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de compilación EAS (preview genera archivo .apk directo)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-apk:
    name: Compilación APK en Expo EAS Cloud
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias del Monorepo
        run: npm ci

      - name: Compilar Paquete Compartido del Monorepo
        run: npm run build -w @plataforma/shared

      - name: Instalar y Configurar Expo EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vincular Proyecto en Expo (EAS Init)
        working-directory: packages/app-universal
        run: |
          npx eas-cli init --account ardyscpn --non-interactive || true

      - name: Lanzar Compilación APK en la Nube de Expo
        working-directory: packages/app-universal
        run: |
          npx eas-cli build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Descarga directa de APK Android (con fallback automático a GitHub Releases)
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="domy.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri @apk_fallback;
    }

    location @apk_fallback {
        return 302 https://github.com/ardysCPN/plataforma-logistica/releases/download/v1.0.0-apk/domy.apk;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
